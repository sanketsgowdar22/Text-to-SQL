# =============================================================================
# ADIP — Docker Compose Service Orchestration
# =============================================================================
# Usage:
#   docker compose -f docker/docker-compose.yml up --build
#   docker compose -f docker/docker-compose.yml down
# =============================================================================

services:
  # ── Backend API Service ──────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: adip-backend
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      - APP_ENV=production
      - DEBUG=false
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── PostgreSQL Database (Production) ─────────────────────────────────────
  # Uncomment when migrating from SQLite to PostgreSQL
  #
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: adip-postgres
  #   environment:
  #     POSTGRES_USER: adip
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
  #     POSTGRES_DB: adip
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U adip"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  backend-data:
    driver: local
  # postgres-data:
  #   driver: local
